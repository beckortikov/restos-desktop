name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='${VERSION}'; fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version ${VERSION}"

      - name: Build Electron (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RestOS-${{ matrix.platform }}-${{ env.VERSION }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.yml
            release/*.blockmap
          retention-days: 90
